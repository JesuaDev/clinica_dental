name: clinica_prodental
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  go_router: ^17.2.1
  google_fonts: ^8.0.2
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  flutter_riverpod: ^3.3.1
  hugeicons: ^1.1.7
  animate_do: ^5.1.0
  syncfusion_flutter_charts: ^33.2.6
  dotted_border: ^3.1.0
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  syncfusion_flutter_calendar: ^33.2.6
  window_manager: ^0.5.1
  intl: ^0.20.2
  lottie: ^3.3.3
  phone_number_controller: ^2.0.0
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - "assets/images/front-pages/illustration_dental.png"
    - "assets/images/avatar_default.png"
    - "assets/waves/wave.svg"

    - "assets/images/svg/500-error.svg"
    - "assets/images/svg/404-error.svg"
    - "assets/images/svg/400-error.svg"
    
    - "assets/lottie/dental-load.json"
    - "assets/lottie/error-animation.json"
    - "assets/lottie/success-animation.json"
    - "assets/lottie/warning-animation.json"
    - "assets/lottie/not-found.json"



  fonts:
    - family: sora-regular
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf

    - family: sora-light
      fonts:
        - asset: assets/fonts/Sora-Light.ttf
